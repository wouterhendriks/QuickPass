name: SnelWachtwoord
options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.6"
    CURRENT_PROJECT_VERSION: "7"
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
targets:
  SnelWachtwoord:
    type: application
    platform: macOS
    sources:
      - Sources/QuickPass
      - path: Resources/Assets.xcassets
      - path: Resources/dutch_diceware.txt
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: nl
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleLocalizations: [nl]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: © 2026 JK Creative Studios LLC. Uitgebracht onder GPLv3.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.webwerf.snelwachtwoord
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
